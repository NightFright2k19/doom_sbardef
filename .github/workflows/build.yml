name: Build SBARDEF HUD PK3s (Autobuild)

on:
  push:
    branches:
      - main
    paths:
      - "autoload/**"

  workflow_dispatch:

concurrency:
  group: sbardef-autobuild
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_NUM: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate and minify sbardef.lmp JSON files
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Validating and minifying sbardef.lmp files..."
          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "  -> $file"

            # Validate the JSON before replacing the source file.
            jq -e empty "$file" >/dev/null

            tmpfile="$(mktemp)"
            trap 'rm -f "$tmpfile"' EXIT
            jq -e -c . "$file" > "$tmpfile"
            mv -- "$tmpfile" "$file"
            trap - EXIT
          done < <(find autoload -type f -name 'sbardef.lmp' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "::error::No sbardef.lmp files were found under autoload/"
            exit 1
          fi

      - name: Create sbardef_mod.pk3 files
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGETS=(
            "autoload/all-all"
            "autoload/chex-all"
            "autoload/freedoom-all"
            "autoload/hacx.wad"
            "autoload/harmonyc.wad"
            "autoload/rekkr-all"
          )

          for dir in "${TARGETS[@]}"; do
            if [[ ! -d "$dir" ]]; then
              echo "::error::Missing target directory: $dir"
              exit 1
            fi

            echo "Processing $dir"
            (
              cd -- "$dir"
              rm -f -- sbardef_mod.pk3

              # -X omits host-specific extra attributes. The output file is
              # removed first so it cannot accidentally be included in itself.
              find . -mindepth 1 -maxdepth 1 ! -name 'sbardef_mod.pk3' -print0 \
                | xargs -0 zip -9 -r -X sbardef_mod.pk3
            )

            if [[ ! -s "$dir/sbardef_mod.pk3" ]]; then
              echo "::error::PK3 was not created or is empty: $dir/sbardef_mod.pk3"
              exit 1
            fi
          done

      - name: Prepare package
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf package
          mkdir -p package/autoload

          mapfile -d '' pk3_files < <(find autoload -type f -name 'sbardef_mod.pk3' -print0)
          if [[ "${#pk3_files[@]}" -eq 0 ]]; then
            echo "::error::No sbardef_mod.pk3 files were created"
            exit 1
          fi

          for file in "${pk3_files[@]}"; do
            destination="package/${file}"
            mkdir -p "$(dirname -- "$destination")"
            cp -- "$file" "$destination"
          done

          for file in autoload/chex3v.wad autoload/id1.wad; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
            cp -- "$file" package/autoload/
          done

      - name: Build final ZIP and checksum
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP_NAME="sbardef_mod_autobuild_r${BUILD_NUM}.zip"
          CHECKSUM_NAME="${ZIP_NAME}.sha256"
          TAG_NAME="autobuild-r${BUILD_NUM}"

          (
            cd package
            rm -f -- "$ZIP_NAME" "$CHECKSUM_NAME"
            zip -9 -r -X "$ZIP_NAME" autoload
            sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
          )

          {
            echo "ZIP_NAME=$ZIP_NAME"
            echo "CHECKSUM_NAME=$CHECKSUM_NAME"
            echo "TAG_NAME=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Generated package SHA-256:"
          cat "package/$CHECKSUM_NAME"

      - name: Create GitHub pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.package.outputs.TAG_NAME }}
          name: Autobuild r${{ env.BUILD_NUM }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: package/${{ steps.package.outputs.ZIP_NAME }},package/${{ steps.package.outputs.CHECKSUM_NAME }}
          body: |
            This "SBARDEF HUD Mod" release has been generated by an automated script.

            **IMPORTANT:**
            - Requires latest Woof! dev snapshot (master branch, newest build)
            - Work-in-progress release, not sufficiently tested. Use at your own risk!

            The SHA-256 checksum for the ZIP is included as a release asset.

      - name: Delete older autobuild releases
        uses: actions/github-script@v8
        env:
          CURRENT_TAG: ${{ steps.package.outputs.TAG_NAME }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = process.env.CURRENT_TAG;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            for (const release of releases) {
              if (
                !release.draft &&
                release.tag_name.startsWith("autobuild-") &&
                release.tag_name !== currentTag
              ) {
                core.info(`Deleting release ${release.tag_name}`);

                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });

                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  core.info(`Tag ${release.tag_name} was already absent`);
                }
              }
            }